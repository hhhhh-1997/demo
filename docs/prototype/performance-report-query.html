<!doctype html>
<html lang="zh-CN" data-theme="blue" data-color-scheme-mode="light-only">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>绩效月报查询 · 绩效管理系统</title>
<style>
/* ============ JoinBright 设计体系 · 博瑞蓝 / 浅色 ============ */
:root {
  --color-primary: #2C7CF5;
  --color-primary-hover: #4091F9;
  --color-primary-light: #EBF3FF;
  --color-primary-bg: #ECF7FF;
  --nav-gradient-from: #2C7CF5;
  --nav-gradient-to: #57AAFE;
  --color-primary-active: #0A64EA;
  --color-success: #00D6A5;
  --color-warning: #FAAD14;
  --color-danger: #FF5959;
  --bg-page: #F2F5F9;
  --bg-surface: #FFFFFF;
  --bg-input: #FFFFFF;
  --text-heading: #000000;
  --text-body: #4A4A4A;
  --text-secondary: #666666;
  --text-hint: #BDBDBD;
  --text-label: #999999;
  --text-danger: #FF5959;
  --border-color: #E5E9F0;
  --border-color-hover: #2C7CF5;
  --border-width: 1px;
  --font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Roboto, "Segoe UI", Arial, sans-serif;
  --font-mono: "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  --space-2: 2px; --space-4: 4px; --space-8: 8px; --space-10: 10px; --space-12: 12px;
  --space-16: 16px; --space-18: 18px; --space-20: 20px; --space-24: 24px; --space-32: 32px;
  --radius-sm: 4px; --radius-base: 12px; --radius-lg: 16px; --radius-round: 999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
  --shadow-base: 0 2px 8px rgba(0,0,0,0.15);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.18);
  --transition-fast: 0.15s ease;
  --transition-base: 0.2s ease;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg-page);
  color: var(--text-body);
  font-family: var(--font-family);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

/* ============ 顶栏（渐变导航） ============ */
.nav-topbar {
  display: flex;
  align-items: center;
  width: 100%;
  height: 50px;
  padding: 0 var(--space-20);
  background: linear-gradient(90deg, var(--nav-gradient-from) -1%, var(--nav-gradient-to) 100%);
  position: sticky;
  top: 0;
  z-index: 50;
}
.nav-brand-logo { height: 28px; width: auto; display: block; }
.nav-topbar-title {
  font-size: 16px;
  font-weight: 600;
  color: #FFFFFF;
  margin-left: var(--space-20);
  letter-spacing: 0.02em;
}
.nav-actions { display: flex; align-items: center; gap: var(--space-12); margin-left: auto; }
.nav-action-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px;
  color: #FFFFFF; background: none; border: none; padding: 0; cursor: pointer;
  border-radius: var(--radius-sm);
  transition: background var(--transition-base), opacity var(--transition-fast);
  opacity: 0.9;
}
.nav-action-btn:hover { background: rgba(255,255,255,0.14); opacity: 1; }
.nav-action-btn:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 2px; }
.nav-action-btn svg { width: 16px; height: 16px; display: block; }
.nav-avatar {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.5);
  color: #FFFFFF; font-size: 12px; font-weight: 600; cursor: pointer;
}
.nav-avatar:hover { background: rgba(255,255,255,0.28); }
.nav-avatar:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 2px; }

/* ============ 主内容 ============ */
.page-main { padding: var(--space-20) var(--space-24) var(--space-40); max-width: 1720px; margin: 0 auto; }
.breadcrumb {
  display: flex; align-items: center; gap: var(--space-8);
  font-size: 13px; color: var(--text-secondary); padding-bottom: var(--space-12);
}
.breadcrumb a { color: var(--text-secondary); text-decoration: none; transition: color var(--transition-fast); }
.breadcrumb a:hover { color: var(--color-primary); }
.breadcrumb-sep { color: var(--text-hint); user-select: none; }
.breadcrumb-current { color: var(--text-heading); }
.page-title {
  font-size: 20px; font-weight: 600; color: var(--text-heading);
  line-height: 1.4; margin-bottom: var(--space-16);
}

/* ============ 卡片 ============ */
.card {
  background: var(--bg-surface);
  border: 0;
  border-radius: var(--radius-base);
  padding: var(--space-20);
}
.card + .card { margin-top: var(--space-12); }
.card-title {
  font-size: 16px; font-weight: 600; color: var(--text-body);
  margin-bottom: var(--space-16);
}

/* ============ 检索条件区 ============ */
.filter-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-12) var(--space-20); }
.form-control { display: flex; flex-direction: column; gap: var(--space-8); }
.form-label { font-size: 14px; color: var(--text-body); line-height: 1.4; }
.form-select { position: relative; }
.form-select select {
  width: 200px; height: 36px; padding: 0 32px 0 12px;
  font-size: 14px; font-family: var(--font-family); color: var(--text-body);
  background: var(--bg-input);
  border: var(--border-width) solid var(--border-color);
  border-radius: var(--radius-sm);
  outline: none; appearance: none; -webkit-appearance: none; cursor: pointer;
  transition: border-color var(--transition-base);
}
.form-select select:hover { border-color: var(--border-color-hover); }
.form-select select:focus { border-color: var(--border-color-hover); }
.form-select select:focus-visible { outline: 2px solid var(--color-primary-light); outline-offset: 0; }
.form-select::after {
  content: ''; position: absolute; right: 14px; top: 50%;
  width: 7px; height: 7px;
  border-right: 1.5px solid var(--text-secondary);
  border-bottom: 1.5px solid var(--text-secondary);
  transform: translateY(-65%) rotate(45deg);
  pointer-events: none;
}
.filter-actions { display: flex; align-items: center; gap: var(--space-10); margin-left: auto; }

/* ============ 按钮 ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 0 18px; height: 36px;
  font-size: 14px; font-family: var(--font-family);
  border-radius: 6px; border: 1px solid transparent; cursor: pointer;
  transition: background var(--transition-base), border-color var(--transition-base), color var(--transition-base);
  white-space: nowrap; user-select: none;
}
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
.btn-primary { background: var(--color-primary); color: #FFFFFF; border-color: var(--color-primary); }
.btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); border-color: var(--color-primary-hover); }
.btn-secondary { background: var(--bg-surface); color: var(--text-heading); border-color: var(--color-primary); }
.btn-secondary:hover:not(:disabled) { background: var(--color-primary-light); }
.btn-ghost { background: transparent; color: var(--text-body); border-color: transparent; }
.btn-ghost:hover:not(:disabled) { background: var(--color-primary-bg); }

/* ============ 结果工具栏 ============ */
.table-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-12);
}
.result-count { font-size: 13px; color: var(--text-secondary); }
.result-count strong { color: var(--text-heading); font-weight: 600; font-variant-numeric: tabular-nums; }
.result-hint { font-size: 13px; color: var(--text-secondary); }

/* ============ 数据表格（固定表头 + 冻结左列） ============ */
.table-scroll {
  border: var(--border-width) solid var(--border-color);
  border-radius: 0;
  overflow: auto;
  max-height: 62vh;
  min-height: 320px;
  background: var(--bg-surface);
}
table { width: 100%; border-collapse: separate; border-spacing: 0; font-family: var(--font-family); }
thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--bg-page);
  font-size: 14px; font-weight: 600; color: var(--text-body);
  text-align: left; padding: 10px 20px;
  border-bottom: var(--border-width) solid var(--border-color);
  white-space: nowrap;
}
tbody td {
  font-size: 14px; color: var(--text-body);
  padding: 10px 20px;
  border-bottom: var(--border-width) solid var(--border-color);
  white-space: nowrap;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--color-primary-bg); }
th.col-sticky, td.col-sticky {
  position: sticky; left: 0;
  box-shadow: inset -1px 0 0 var(--border-color);
}
th.col-sticky { z-index: 3; background: var(--bg-page); }
td.col-sticky { z-index: 1; background: var(--bg-surface); }
tbody tr:hover td.col-sticky { background: var(--color-primary-bg); }
th.num, td.num { text-align: right; }
td.num {
  font-variant-numeric: tabular-nums;
  color: var(--text-heading);
}
.cell-muted { color: var(--text-hint); }

/* ============ 徽标（等级项） ============ */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; padding: 2px 8px;
  border-radius: var(--radius-round);
  font-weight: 600; line-height: 1.3;
  white-space: nowrap;
}
.badge-success { background: rgba(0, 214, 165, 0.14); color: #00805C; }
.badge-info { background: rgba(44, 124, 245, 0.12); color: #1E63D0; }
.badge-warning { background: rgba(250, 173, 20, 0.16); color: #9A6200; }
.badge-danger { background: rgba(255, 89, 89, 0.14); color: #D32F2F; }
.badge-muted { background: var(--bg-page); color: var(--text-secondary); }

/* ============ 状态视图（加载/空/错误） ============ */
.state-view {
  display: none;
  flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: var(--space-12);
  min-height: 320px; padding: var(--space-32);
  border: var(--border-width) solid var(--border-color);
  background: var(--bg-surface);
}
.state-view.is-visible { display: flex; }
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border-color);
  border-top-color: var(--color-primary);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.state-icon { width: 48px; height: 48px; color: var(--text-hint); }
.state-title { font-size: 16px; font-weight: 600; color: var(--text-heading); }
.state-desc { font-size: 14px; color: var(--text-secondary); max-width: 420px; line-height: 1.6; }
.state-error .state-title { color: var(--text-heading); }
.state-error .state-icon { color: var(--color-danger); }

/* ============ 演示开关 ============ */
.demo-toggle {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text-secondary);
  cursor: pointer; user-select: none;
  padding-left: var(--space-12);
  border-left: 1px solid var(--border-color);
}
.demo-toggle input { accent-color: var(--color-primary); width: 15px; height: 15px; cursor: pointer; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
}
</style>
</head>
<body>

<nav class="nav-topbar" data-od-id="nav-topbar">
  <img class="nav-brand-logo" src="assets/logo-white.png" alt="JoinBright" />
  <span class="nav-topbar-title">绩效管理系统</span>
  <div class="nav-actions">
    <button class="nav-action-btn" type="button" aria-label="通知" title="通知">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2a4 4 0 0 1 4 4v2l1.6 2.6H2.4L4 8V6a4 4 0 0 1 4-4Z"/><path d="M6.5 13a1.5 1.5 0 0 0 3 0"/></svg>
    </button>
    <button class="nav-action-btn" type="button" aria-label="设置" title="设置">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M3 8h10M3 11.5h10"/><circle cx="6.2" cy="4.5" r="1.4" fill="#2C7CF5" stroke="none"/><circle cx="9.8" cy="8" r="1.4" fill="#2C7CF5" stroke="none"/><circle cx="7" cy="11.5" r="1.4" fill="#2C7CF5" stroke="none"/></svg>
    </button>
    <button class="nav-avatar" type="button" aria-label="当前用户">管</button>
  </div>
</nav>

<main class="page-main">
  <nav class="breadcrumb" aria-label="面包屑">
    <a href="#">首页</a>
    <span class="breadcrumb-sep">/</span>
    <a href="#">绩效管理</a>
    <span class="breadcrumb-sep">/</span>
    <span class="breadcrumb-current">绩效月报查询</span>
  </nav>
  <h1 class="page-title" data-od-id="page-title">绩效月报查询</h1>

  <!-- 检索条件区 -->
  <section class="card" data-od-id="filter-panel">
    <div class="filter-row">
      <div class="form-control">
        <label class="form-label" for="filter-dept">一级部门</label>
        <div class="form-select">
          <select id="filter-dept" data-od-id="dept-select">
            <option value="">全部</option>
            <option value="10">技术中心</option>
            <option value="20">第一事业部</option>
            <option value="30">第二事业部</option>
            <option value="40">第三事业部</option>
            <option value="50">第四事业部</option>
            <option value="60">第五事业部</option>
          </select>
        </div>
      </div>
      <div class="form-control">
        <label class="form-label" for="filter-role">岗位</label>
        <div class="form-select">
          <select id="filter-role" data-od-id="role-select">
            <option value="">全部</option>
            <option value="dev">研发</option>
            <option value="qa">测试</option>
            <option value="pm">项目经理</option>
            <option value="po">产品经理</option>
            <option value="td">需求设计</option>
            <option value="operation">运营/行政</option>
            <option value="support">实施</option>
            <option value="ue">UE</option>
            <option value="wish">巴长</option>
            <option value="hr">人资</option>
            <option value="top">高层管理</option>
            <option value="ro">实施需设</option>
          </select>
        </div>
      </div>
      <div class="filter-actions">
        <button class="btn btn-primary" type="button" id="btn-query" data-od-id="query-button">查询</button>
        <button class="btn btn-secondary" type="button" id="btn-reset" data-od-id="reset-button">重置</button>
        <label class="demo-toggle" data-od-id="simulate-toggle" title="开启后，点击「查询」将模拟接口异常">
          <input type="checkbox" id="toggle-simulate" />
          模拟接口异常
        </label>
      </div>
    </div>
  </section>

  <!-- 数据表格区 -->
  <section class="card" data-od-id="result-table">
    <div class="table-toolbar">
      <span class="result-count">共 <strong id="result-count">0</strong> 条记录</span>
      <span class="result-hint">默认不分页 · 表头固定 · 左侧姓名列冻结</span>
    </div>

    <div class="table-scroll" id="table-scroll">
      <table id="result-table-body">
        <thead>
          <tr>
            <th class="col-sticky">姓名</th>
            <th>月份</th>
            <th>一级部门</th>
            <th>二级部门</th>
            <th>岗位</th>
            <th class="num">任务完成率</th>
            <th class="num">工作有效率</th>
            <th class="num">工作规范性</th>
            <th class="num">学习及能力提升</th>
            <th class="num">软需设计</th>
            <th>售前支撑</th>
            <th class="num">缺陷情况</th>
            <th class="num">概要设计</th>
            <th class="num">代码评审</th>
            <th>测试产出质量</th>
          </tr>
        </thead>
        <tbody id="table-tbody"></tbody>
      </table>
    </div>

    <!-- 加载态 -->
    <div class="state-view" id="state-loading">
      <div class="spinner"></div>
      <div class="state-desc">正在加载数据…</div>
    </div>

    <!-- 空态 -->
    <div class="state-view" id="state-empty">
      <svg class="state-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12h32M8 24h20M8 36h14"/></svg>
      <div class="state-title">暂无数据</div>
      <div class="state-desc">当前检索条件下没有匹配的绩效记录，请调整筛选条件后重试。</div>
      <button class="btn btn-secondary" type="button" id="btn-empty-reset">重置条件</button>
    </div>

    <!-- 错误态 -->
    <div class="state-view state-error" id="state-error">
      <svg class="state-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="16"/><path d="M24 16v9M24 31v.5"/></svg>
      <div class="state-title">查询失败</div>
      <div class="state-desc">接口请求异常：网络连接失败（HTTP 503），请稍后重试。</div>
      <button class="btn btn-primary" type="button" id="btn-error-retry">重试</button>
    </div>
  </section>
</main>

<script>
/* =====================================================================
   绩效月报查询 —— 展示层逻辑
   职责边界：数据为「原始数据」（后端直出），以下仅在展示层做格式化与映射：
   · 分值项 NULL → '-'；数值 0 → '0.0'（一位小数，0 与 NULL 语义相反）
   · 等级项 1~5 → 中文等级文本；NULL 或越界 → '-'（兜底）
   · 等级项不做求和/平均/数值排序，视觉上与分值项区分
   ===================================================================== */

/* 数据列序（数组下标）：
   0 姓名  1 月份  2 一级部门  3 二级部门  4 岗位key  5 岗位名
   6 任务完成率  7 工作有效率  8 工作规范性  9 学习及能力提升  10 软需设计

const SCORE_COLS = [6, 7, 8, 9, 10, 12, 13, 14];   // 分值项（一位小数）
const GRADE_COLS = [11, 15];                        // 等级项（映射为文本徽标）

const GRADE_MAP = { 1: '超出预期', 2: '完全达标', 3: '需要提升', 4: '未达预期', 5: '无该项工作' };
const GRADE_CLASS = { 1: 'badge-success', 2: 'badge-info', 3: 'badge-warning', 4: 'badge-danger', 5: 'badge-muted' };

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* 分值项：NULL → '-'；否则保留一位小数（0 → '0.0'） */
function fmtScore(v) {
  if (v === null || v === undefined || v === '') return '<span class="cell-muted">-</span>';
  return Number(v).toFixed(1);
}

/* 等级项：映射为文本徽标；NULL 或越界 → '-' 兜底 */
function gradeBadge(v) {
  if (v === null || v === undefined || v === '') return '<span class="cell-muted">-</span>';
  const text = GRADE_MAP[v];
  if (!text) return '<span class="cell-muted">-</span>';
  return '<span class="badge ' + GRADE_CLASS[v] + '">' + text + '</span>';
}

function renderRow(r) {
  return '<tr>'
    + '<td class="col-sticky">' + esc(r[0]) + '</td>'
    + '<td>' + esc(r[1]) + '</td>'
    + '<td>' + esc(r[2]) + '</td>'
    + '<td>' + esc(r[3]) + '</td>'
    + '<td>' + esc(r[5]) + '</td>'
    + '<td class="num">' + fmtScore(r[6]) + '</td>'
    + '<td class="num">' + fmtScore(r[7]) + '</td>'
    + '<td class="num">' + fmtScore(r[8]) + '</td>'
    + '<td class="num">' + fmtScore(r[9]) + '</td>'
    + '<td class="num">' + fmtScore(r[10]) + '</td>'
    + '<td class="grade">' + gradeBadge(r[11]) + '</td>'
    + '<td class="num">' + fmtScore(r[12]) + '</td>'
    + '<td class="num">' + fmtScore(r[13]) + '</td>'
    + '<td class="num">' + fmtScore(r[14]) + '</td>'
    + '<td class="grade">' + gradeBadge(r[15]) + '</td>'
    + '</tr>';
}

/* 月份按字符串比较排序（最新在前），同月保持原始顺序 */
const SORTED = DATA.slice().sort(function (a, b) {
  return a[1] < b[1] ? 1 : a[1] > b[1] ? -1 : 0;
});

const deptSelect = document.getElementById('filter-dept');
const roleSelect = document.getElementById('filter-role');
const tbody = document.getElementById('table-tbody');
const resultCount = document.getElementById('result-count');
const tableScroll = document.getElementById('table-scroll');
const stateLoading = document.getElementById('state-loading');
const stateEmpty = document.getElementById('state-empty');
const stateError = document.getElementById('state-error');
const simulateToggle = document.getElementById('toggle-simulate');

/* 过滤：一级部门按 ID、岗位按 key；空值（''）不拼入过滤 */
function applyFilter() {
  const dept = deptSelect.value;
  const role = roleSelect.value;
  return SORTED.filter(function (r) {
    if (dept && r[16] !== Number(dept)) return false;
    if (role && r[4] !== role) return false;
    return true;
  });
}

function showState(view) {
  tableScroll.style.display = view === 'data' ? '' : 'none';
  stateLoading.classList.toggle('is-visible', view === 'loading');
  stateEmpty.classList.toggle('is-visible', view === 'empty');
  stateError.classList.toggle('is-visible', view === 'error');
}

function renderTable(rows) {
  resultCount.textContent = String(rows.length);
  if (rows.length === 0) {
    showState('empty');
    return;
  }
  tbody.innerHTML = rows.map(renderRow).join('');
  tableScroll.scrollTop = 0;
  tableScroll.style.display = '';
  showState('data');
}

function query() {
  showState('loading');
  window.setTimeout(function () {
    if (simulateToggle.checked) {
      showState('error');
      return;
    }
    renderTable(applyFilter());
  }, 600);
}

document.getElementById('btn-query').addEventListener('click', query);
document.getElementById('btn-reset').addEventListener('click', function () {
  deptSelect.value = '';
  roleSelect.value = '';
  query();
});
document.getElementById('btn-empty-reset').addEventListener('click', function () {
  deptSelect.value = '';
  roleSelect.value = '';
  query();
});
document.getElementById('btn-error-retry').addEventListener('click', query);

/* 初始加载：默认展示全部（按月份降序） */
renderTable(SORTED);
</script>
