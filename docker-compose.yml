services:
  # MySQL 服务
  mysql:
    image: mysql:8.0
    container_name: mysql-server
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: default_db
    volumes:
      - ./mysql/data:/var/lib/mysql
    networks:
      - app-network

  # Redis 服务
  redis:
    image: redis:7.0-alpine
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    volumes:
      - ./redis/data:/data
    networks:
      - app-network

  # MinIO 对象存储服务
  minio:
    image: docker.1ms.run/pgsty/minio:RELEASE.2026-02-14T12-00-00Z-amd64
    container_name: minio-server
    restart: always
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    environment:
      MINIO_ROOT_USER: ruoyi
      MINIO_ROOT_PASSWORD: ruoyi123
      MINIO_COMPRESS: "off"
    volumes:
      - ./minio/data:/data
      - ./minio/config:/root/.minio
    command: server --address ':9000' --console-address ':9001' /data
    privileged: true
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
